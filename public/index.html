<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOT IDE</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="app-brand">
                <img class="app-logo" src="favicon.svg" alt="" width="24" height="24">
                <h1>DOT IDE</h1>
            </div>

            <div class="header-controls">
                <label for="engine">Layout</label>
                <select id="engine">
                    <option value="dot">dot &mdash; hierarchical</option>
                    <option value="neato">neato &mdash; spring model</option>
                    <option value="fdp">fdp &mdash; force-directed</option>
                    <option value="sfdp">sfdp &mdash; force-directed, large graphs</option>
                    <option value="circo">circo &mdash; circular</option>
                    <option value="twopi">twopi &mdash; radial</option>
                    <option value="osage">osage &mdash; clustered</option>
                    <option value="patchwork">patchwork &mdash; treemap</option>
                </select>
                <button type="button" id="reset">Reset to default</button>
            </div>
        </header>

        <main class="panes">
            <div class="pane pane--editor" id="editor"></div>

            <div class="pane pane--graph">
                <div class="graph-viewport" id="graph">
                    <div class="graph-stage" id="stage"></div>
                </div>

                <div class="zoom-controls" id="zoom-controls">
                    <button type="button" data-zoom="in" title="Zoom in" aria-label="Zoom in">+</button>
                    <button type="button" data-zoom="out" title="Zoom out" aria-label="Zoom out">&minus;</button>
                    <button type="button" data-zoom="home" title="Reset view" aria-label="Reset view">&#8962;</button>
                </div>

                <div class="busy" id="busy" hidden>Laying out&hellip;</div>
                <div class="diagnostics" id="diagnostics" hidden></div>
            </div>
        </main>

        <footer class="app-footer" id="exports">
            <span class="footer-label">Export</span>
            <button type="button" data-export="svg">SVG</button>
            <button type="button" data-export="png">PNG</button>
            <button type="button" data-export="dot">DOT source</button>
            <button type="button" data-export="copy">Copy SVG</button>
            <span class="status" id="status" role="status" aria-live="polite"></span>
        </footer>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
